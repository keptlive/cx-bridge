[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-agent-bridge"
version = "0.3.0"
description = "A portable CLI, MCP, ACP, and Python SDK bridge for Claude Code, Codex, Antigravity, and external agent frameworks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cx-bridge = "cx_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cx_bridge = ["panel_assets/*"]
