[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cx-agent-bridge"
version = "0.1.0"
description = "A portable, two-way CLI bridge for Claude Code and Codex"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cx-bridge = "cx_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
